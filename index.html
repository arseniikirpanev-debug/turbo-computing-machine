<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>PUBG Light</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #070709; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; touch-action: none; }
        .hud { display: flex; gap: 15px; font-weight: bold; margin-bottom: 5px; }
        .hb { background: #121216; padding: 6px 12px; border-radius: 12px; border: 1px solid #22222a; }
        .hb span { color: #ffa000; }
        .game { position: relative; width: 100%; max-width: 360px; }
        canvas { background: #182215; border: 2px solid #22222a; border-radius: 12px; display: block; width: 100%; height: auto; }
        .btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffa000; color: #070709; border: none; padding: 12px 28px; font-weight: bold; border-radius: 20px; cursor: pointer; z-index: 10; }
        .ctr { display: flex; justify-content: space-between; width: 100%; max-width: 360px; padding: 15px 20px; }
        .jz { width: 85px; height: 85px; background: rgba(255,255,255,0.05); border: 2px dashed rgba(255,255,255,0.15); border-radius: 50%; position: relative; }
        .js { width: 35px; height: 35px; background: #fff; border-radius: 50%; position: absolute; top: 23px; left: 23px; }
        .sb { width: 75px; height: 75px; background: #ff3b30; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="hud">
        <div class="hb">Живых: <span id="a">6</span></div>
        <div class="hb">Kills: <span id="k">0</span></div>
        <div class="hb">HP: <span id="h">100</span></div>
    </div>
    <div class="game">
        <canvas id="c" width="360" height="360"></canvas>
        <button class="btn" id="b">В БОЙ</button>
    </div>
    <div class="ctr">
        <div class="jz" id="jz"><div class="js" id="js"></div></div>
        <div class="sb" id="sb">FIRE</div>
    </div>
    <script>
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d'), btn = document.getElementById('b'), hpEl = document.getElementById('h'), aliveEl = document.getElementById('a'), killsEl = document.getElementById('k'), jz = document.getElementById('jz'), js = document.getElementById('js'), sb = document.getElementById('sb');
        let player, bots, bullets, items, zone, running = false, iv, jX = 0, jY = 0, isM = false;
        
        function start() {
            player = { x: 180, y: 180, r: 10, hp: 100, angle: 0, speed: 2.5, kills: 0 };
            bots = []; bullets = []; items = []; zone = { x: 180, y: 180, r: 240, targetR: 240, timer: 0 };
            for(let i=0; i<5; i++) bots.push({ x: Math.random()*300+30, y: Math.random()*300+30, r: 10, hp: 50, speed: 1.3, angle: Math.random()*Math.PI*2, last: 0 });
            for(let i=0; i<5; i++) items.push({ x: Math.random()*320+20, y: Math.random()*320+20 });
            running = true; btn.style.display = 'none'; updateHUD(); clearInterval(iv); iv = setInterval(update, 25);
        }
        
        function update() {
            if (!running) return;
            if (isM) {
                player.x = Math.max(player.r, Math.min(360 - player.r, player.x + jX * player.speed));
                player.y = Math.max(player.r, Math.min(360 - player.r, player.y + jY * player.speed));
                player.angle = Math.atan2(jY, jX);
            }
            zone.timer++;
            if (zone.timer % 400 === 0 && zone.targetR > 40) zone.targetR -= 50;
            if (zone.r > zone.targetR) zone.r -= 0.3;
            if (zone.timer % 40 === 0) {
                if (Math.hypot(player.x - zone.x, player.y - zone.y) > zone.r) { player.hp -= 5; updateHUD(); }
                bots.forEach(b => { if (Math.hypot(b.x - zone.x, b.y - zone.y) > zone.r) b.hp -= 5; });
            }
            bots = bots.filter(b => b.hp > 0);
            bots.forEach(b => {
                b.x += Math.cos(b.angle) * b.speed; b.y += Math.sin(b.angle) * b.speed;
                if(b.x<b.r || b.x>360-b.r || b.y<b.r || b.y>360-b.r || Math.random()<0.02) b.angle = Math.random()*Math.PI*2;
                if (Math.hypot(player.x - b.x, player.y - b.y) < 130 && Date.now() - b.last > 1500) {
                    b.angle = Math.atan2(player.y - b.y, player.x - b.x);
                    bullets.push({ x: b.x, y: b.y, dx: Math.cos(b.angle)*5, dy: Math.sin(b.angle)*5, owner: 'bot' });
                    b.last = Date.now();
                }
            });
            bullets.forEach((bl, bIdx) => {
                bl.x += bl.dx; bl.y += bl.dy;
                if (bl.owner === 'bot' && Math.hypot(player.x - bl.x, player.y - bl.y) < player.r) { player.hp -= 15; bullets.splice(bIdx, 1); updateHUD(); }
                else if (bl.owner === 'player') {
                    bots.forEach(b => {
                        if (Math.hypot(b.x - bl.x, b.y - bl.y) < b.r) {
                            b.hp -= 25; bullets.splice(bIdx, 1);
                            if (b.hp <= 0) { player.kills++; updateHUD(); }
                        }
                    });
                }
            });
            bullets = bullets.filter(b => b.x>0 && b.x<360 && b.y>0 && b.y<360);
            items.forEach((it, iIdx) => {
                if (Math.hypot(player.x - it.x, player.y - it.y) < player.r + 8) { player.hp = Math.min(100, player.hp + 35); items.splice(iIdx, 1); updateHUD(); }
            });
            if (player.hp <= 0) return end(false);
            if (bots.length === 0) return end(true);
            aliveEl.innerText = bots.length + 1;
            draw();
        }
        
        function draw() {
            ctx.clearRect(0,0, 360, 360);
            ctx.strokeStyle = '#00e5ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(zone.x, zone.y, zone.r, 0, Math.PI*2); ctx.stroke();
            items.forEach(it => { ctx.fillStyle = '#04d361'; ctx.font = '12px sans-serif'; ctx.fillText('➕', it.x - 6, it.y + 4); });
            ctx.fillStyle = '#fff'; bullets.forEach(b => ctx.fillRect(b.x, b.y, 3, 3));
            ctx.fillStyle = '#ff4444'; bots.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#111'; ctx.fillRect(b.x + Math.cos(b.angle)*6 - 2, b.y + Math.sin(b.angle)*6 - 2, 4, 4); });
            ctx.fillStyle = '#ffcc00'; ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#111'; ctx.fillRect(player.x + Math.cos(player.angle)*8 - 2, player.y + Math.sin(player.angle)*8 - 2, 4, 4);
        }
        
        function updateHUD() { hpEl.innerText = Math.max(0, player.hp); killsEl.innerText = player.kills; }
        function end(win) { running = false; clearInterval(iv); btn.style.display = 'block'; btn.innerText = win ? 'ПОБЕДА! ТОП-1 🏆' : 'КОНЕЦ ИГРЫ'; }
        
        jz.addEventListener('touchstart', (e) => { isM = true; move(e); });
        jz.addEventListener('touchmove', (e) => { move(e); });
        jz.addEventListener('touchend', () => { isM = false; js.style.transform = 'none'; });
        function move(e) {
            let r = jz.getBoundingClientRect(), c = { x: r.left + 42, y: r.top + 42 }, dx = e.touches[0].clientX - c.x, dy = e.touches[0].clientY - c.y, d = Math.hypot(dx, dy);
            if (d > 25) { dx = (dx / d) * 25; dy = (dy / d) * 25; }
            js.style.transform = `translate(${dx}px, ${dy}px)`; jX = dx / 25; jY = dy / 25;
        }
        sb.addEventListener('touchstart', (e) => { e.preventDefault(); if(running) bullets.push({ x: player.x, y: player.y, dx: Math.cos(player.angle)*6, dy: Math.sin(player.angle)*6, owner: 'player' }); });
        btn.addEventListener('click', start);
    </script>
</body>
</html>
